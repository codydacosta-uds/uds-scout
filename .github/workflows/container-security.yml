name: Container security

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - app/**
      - components/**
      - lib/**
      - public/**
      - next.config.ts
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 3"

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Build and scan production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build without application credentials
        run: docker build --tag uds-scout:ci .
      - name: Scan image vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uds-scout:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
