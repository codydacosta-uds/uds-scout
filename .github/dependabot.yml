version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      test-tooling:
        patterns:
          - "@playwright/*"
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "jsdom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
    open-pull-requests-limit: 10
