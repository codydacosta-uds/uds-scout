version: "3"

# UDS Scout local development tasks.
vars:
  DOCKER_IMAGE: uds-scout
  DOCKER_CONTAINER: uds-scout
  # Keep the legacy volume name so existing repository selections survive the rebrand.
  DOCKER_VOLUME: d2d-operations-data

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  start:
    desc: Start UDS Scout on 127.0.0.1:3001
    cmds:
      - test -d node_modules || npm install
      - echo "UDS Scout http://d2d.admin.uds.localhost:3001/"
      - zsh -c 'source "$HOME/.zshrc" && npm run dev'
    silent: true

  setup:
    desc: Install Node.js dependencies
    cmds:
      - npm install

  check:
    desc: Run lint, policy tests, coverage, restricted-runner, and production build checks
    cmds:
      - npm run lint
      - npm run test:coverage
      - npm run coverage:badge
      - npm run test:runner
      - npm run build

  build:
    desc: Create a production build
    cmds:
      - npm run build

  docker:build:
    desc: Build the local production container image
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: Docker is not running. Start Docker Desktop or another Docker-compatible engine.
    cmds:
      - docker build --tag {{.DOCKER_IMAGE}} .

  docker:start:
    desc: Build and start Docker; load optional runtime credentials from .env.local
    deps:
      - docker:build
    preconditions:
      - sh: command -v curl >/dev/null 2>&1
        msg: curl is required to verify that UDS Scout is reachable from the host.
    cmds:
      - docker rm --force {{.DOCKER_CONTAINER}} >/dev/null 2>&1 || true
      - docker rm --force d2d-operations >/dev/null 2>&1 || true
      # OrbStack can briefly retain a removed container's loopback forwarding entry.
      - sleep 3
      - >-
        docker run --detach
        --name {{.DOCKER_CONTAINER}}
        --publish 127.0.0.1:{{.PORT | default "3001"}}:3001
        --mount source={{.DOCKER_VOLUME}},target=/data
        $(if [ -f .env.local ]; then printf '%s' '--env-file .env.local'; fi)
        $(for variable in GITHUB_TOKEN GH_TOKEN GITLAB_TOKEN GITLAB_URL UDS_SCOUT_DEFENSE_REGISTRY_USERNAME UDS_SCOUT_DEFENSE_REGISTRY_PASSWORD NVD_API_KEY GITHUB_REPOSITORIES; do eval "value=\${$variable:-}"; if [ -n "$value" ]; then printf ' --env %s' "$variable"; fi; done)
        {{.DOCKER_IMAGE}}
      - |
        attempts=0
        until curl --fail --silent --max-time 2 http://127.0.0.1:{{.PORT | default "3001"}}/api/setup/status >/dev/null; do
          attempts=$((attempts + 1))
          if [ "$attempts" -ge 30 ]; then
            echo "UDS Scout started in Docker but is not reachable at http://127.0.0.1:{{.PORT | default "3001"}}."
            docker logs --tail 50 {{.DOCKER_CONTAINER}} || true
            exit 1
          fi
          sleep 1
        done
      - echo "UDS Scout is ready at http://127.0.0.1:{{.PORT | default "3001"}}"
      - echo "Open the URL and enter your GitHub token to continue if it was not supplied at runtime."
    silent: true

  docker:update:
    aliases: [update]
    desc: Pull the latest main branch, rebuild the image, and restart UDS Scout
    preconditions:
      - sh: command -v git >/dev/null 2>&1
        msg: Git is required to update UDS Scout.
      - sh: test "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = "true"
        msg: Run this task from the cloned UDS Scout repository.
      - sh: test "$(git branch --show-current)" = "main"
        msg: Switch to the main branch before updating UDS Scout.
      - sh: test -z "$(git status --porcelain)"
        msg: Commit, stash, or remove local changes before updating UDS Scout.
      - sh: git remote get-url origin >/dev/null 2>&1
        msg: The cloned repository must have an origin remote.
      - sh: docker info >/dev/null 2>&1
        msg: Docker is not running. Start Docker Desktop or another Docker-compatible engine.
    cmds:
      - git fetch origin main
      - git merge --ff-only origin/main
      - task docker:start PORT={{.PORT | default "3001"}}

  docker:stop:
    desc: Stop and remove the Docker container while preserving workspace settings
    cmds:
      - docker rm --force {{.DOCKER_CONTAINER}} >/dev/null 2>&1 || true
      - echo "UDS Scout stopped. Saved repository selections were preserved."
    silent: true

  docker:logs:
    desc: Follow logs from the Docker container
    cmds:
      - docker logs --follow {{.DOCKER_CONTAINER}}
