version: "3"

# D2D Operations local development tasks.
vars:
  DOCKER_IMAGE: d2d-operations
  DOCKER_CONTAINER: d2d-operations
  DOCKER_VOLUME: d2d-operations-data

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  start:
    desc: Start D2D Operations on 127.0.0.1:3001
    cmds:
      - test -d node_modules || npm install
      - echo "D2D Operations http://d2d.admin.uds.localhost:3001/"
      - zsh -c 'source "$HOME/.zshrc" && npm run dev'
    silent: true

  setup:
    desc: Install Node.js dependencies
    cmds:
      - npm install

  check:
    desc: Run lint and production build checks
    cmds:
      - npm run lint
      - npm run build

  build:
    desc: Create a production build
    cmds:
      - npm run build

  docker:build:
    desc: Build the local production container image
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: Docker is not running. Start Docker Desktop or another Docker-compatible engine.
    cmds:
      - docker build --tag {{.DOCKER_IMAGE}} .

  docker:start:
    desc: Build and start Docker; enter the GitHub token in the setup screen
    deps:
      - docker:build
    cmds:
      - docker rm --force {{.DOCKER_CONTAINER}} >/dev/null 2>&1 || true
      - >-
        docker run --detach
        --name {{.DOCKER_CONTAINER}}
        --publish 127.0.0.1:{{.PORT | default "3001"}}:3001
        --mount source={{.DOCKER_VOLUME}},target=/data
        {{.DOCKER_IMAGE}}
      - echo "D2D Operations is starting at http://127.0.0.1:{{.PORT | default "3001"}}"
      - echo "Open the URL and enter your GitHub token to continue."
    silent: true

  docker:stop:
    desc: Stop and remove the Docker container while preserving workspace settings
    cmds:
      - docker rm --force {{.DOCKER_CONTAINER}} >/dev/null 2>&1 || true
      - echo "D2D Operations stopped. Saved repository selections were preserved."
    silent: true

  docker:logs:
    desc: Follow logs from the Docker container
    cmds:
      - docker logs --follow {{.DOCKER_CONTAINER}}
